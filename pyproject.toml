[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-data-platform"
version = "0.1.0"
description = "Multi-tenant medallion pipeline (Bronze/Silver/Gold) for delivery analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyspark==3.5.5",
  "delta-spark==3.2.1",
  "omegaconf==2.3.0",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.2",
]

[project.scripts]
saas-pipeline = "saas_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

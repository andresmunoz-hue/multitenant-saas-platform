# Shared defaults for local multi-tenant medallion pipeline
paths:
  raw_deliveries: raw/global_mobility_data_entrega_productos.csv
  raw_materials: raw/materials_catalog.csv
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  quarantine_root: data
  quality_logs: data/shared/quality_logs

execution:
  start_date: "2025-01-01"
  end_date: "2025-06-30"
  tenant: all
  fail_fast: false

quality:
  fail_on_critical: false

business:
  cs_to_st_factor: 20
  valid_delivery_types:
    - ZPRE
    - ZVE1
    - Z04
    - Z05
  routine_types:
    - ZPRE
    - ZVE1
  bonus_types:
    - Z04
    - Z05

spark:
  app_name: saas-data-platform
  master: local[*]
  timezone: UTC
